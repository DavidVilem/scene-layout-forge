name: Numerical and portability checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -B scripts/check_package.py
      - run: python -B scripts/check_examples.py
      - run: python -B -m unittest discover -s scripts -p "test_*.py"
      - run: python -B -m unittest discover -s tests -p "test_*.py"
